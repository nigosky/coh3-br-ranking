name: CoH3 Brasil — Ranking Unificado BR

on:
  schedule:
    # Janelas fora do minuto :00 (evita fila/drop do cron do GitHub) + backup idempotente 35 min depois:
    # Madrugada (~00:02 BRT = 03:02 UTC; backup 00:37 BRT = 03:37 UTC)
    - cron: "2 3 * * *"
    - cron: "37 3 * * *"
    # Meio-dia (~12:02 BRT = 15:02 UTC; backup 12:37 BRT = 15:37 UTC)
    - cron: "2 15 * * *"
    - cron: "37 15 * * *"
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "assets/**"
      - "config.json"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Forçar atualização do Painel no Discord mesmo sem mudança de ELO?"
        required: false
        default: true
        type: boolean
      recreate_message:
        description: "Apagar e recriar a mensagem fixa do Ranking do zero no Discord?"
        required: false
        default: false
        type: boolean
      add_player:
        description: "➕ Adicionar jogador extra (SteamID64 ou link coh3stats.com)"
        required: false
        default: ""
        type: string
      remove_player:
        description: "➖ Remover jogador extra (SteamID64 ou link coh3stats.com)"
        required: false
        default: ""
        type: string
      backfill_history:
        description: "📚 Completar backfill histórico 2v2 (orçamento estendido de 22 min)"
        required: false
        default: false
        type: boolean
      delete_message_ids:
        description: "🧹 IDs de mensagens antigas do Discord para apagar (separados por vírgula)"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: coh3-br-ranking-state
  cancel-in-progress: false

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout seguro na branch ativa (SHA imutavel)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Checagem idempotente de janela BRT (evita duplicacao em cron de backup)
        id: guard
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 schedule_guard.py --check both --github-output
          if [ "${EVENT_NAME}" = "schedule" ]; then
            RANKING_DUE="$(grep -E '^ranking_due=' "${GITHUB_OUTPUT}" | tail -n1 | cut -d= -f2 || echo 'true')"
            if [ "${RANKING_DUE}" = "true" ]; then
              echo "should_run=true" >> "${GITHUB_OUTPUT}"
            else
              echo "should_run=false" >> "${GITHUB_OUTPUT}"
              echo "Janela atual do Ranking já concluída; encerrando cedo sem reprocessar."
            fi
          else
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Preparar renderizador grafico seguro (apt oficial assinado GPG, zero pip)
        if: steps.guard.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          APT_OPTS=(-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=25 -o Acquire::Retries=2)
          NEED_PKGS=()
          if ! python3 -c "from PIL import Image, ImageDraw, ImageFont" >/dev/null 2>&1; then
            NEED_PKGS+=("python3-pil")
          fi
          if [ ! -d "/usr/share/fonts/truetype/dejavu" ]; then
            NEED_PKGS+=("fonts-dejavu-core" "fonts-liberation")
          fi
          if [ ! -d "/usr/share/fonts/truetype/roboto" ]; then
            NEED_PKGS+=("fonts-roboto")
          fi
          NEED_CJK=0
          if [ -z "$(find /usr/share/fonts \( -iname '*NotoSansCJK*' -o -iname 'wqy-*.ttc' \) -print -quit 2>/dev/null)" ]; then
            NEED_CJK=1
          fi
          if [ "${#NEED_PKGS[@]}" -gt 0 ] || [ "${NEED_CJK}" -eq 1 ]; then
            sudo apt-get "${APT_OPTS[@]}" update -qq
          fi
          if [ "${#NEED_PKGS[@]}" -gt 0 ]; then
            sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends "${NEED_PKGS[@]}"
          fi
          if [ "${NEED_CJK}" -eq 1 ]; then
            timeout 90 sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends fonts-wqy-microhei \
              || echo "::warning::Fonte CJK opcional (fonts-wqy-microhei) indisponivel no mirror Ubuntu; seguindo com fallback DejaVu."
          fi

      - name: Executar suite de testes automatizados (gate pre-publicacao)
        if: steps.guard.outputs.should_run == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m py_compile *.py tests/*.py
          python3 -m unittest discover -s tests -v

      - name: Atualizar Ranking Unificado BR e publicar Painel Fixo no Discord
        if: steps.guard.outputs.should_run == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          DISCORD_RANKING_WEBHOOK_URL: ${{ secrets.DISCORD_RANKING_WEBHOOK_URL }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORCE: ${{ inputs.force_update }}
          INPUT_RECREATE: ${{ inputs.recreate_message }}
          INPUT_ADD_PLAYER: ${{ inputs.add_player }}
          INPUT_REMOVE_PLAYER: ${{ inputs.remove_player }}
          INPUT_BACKFILL: ${{ inputs.backfill_history }}
          INPUT_DELETE_IDS: ${{ inputs.delete_message_ids }}
        run: |
          set -euo pipefail

          ARGS=()
          if [ -n "${DISCORD_RANKING_WEBHOOK_URL:-}" ]; then
            ARGS+=(--verify-discord)
          else
            echo "::notice::Secret DISCORD_RANKING_WEBHOOK_URL ainda nao configurado — rodando varredura e validacao offline."
          fi

          # Na execucao agendada (00h e 12h BRT) ou manual com force_update=true, garante atualizacao do painel
          if [ "${EVENT_NAME}" = "schedule" ] || [ "${INPUT_FORCE:-false}" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ "${INPUT_RECREATE:-false}" = "true" ]; then
            ARGS+=(--recreate-message)
          fi
          if [ -n "${INPUT_ADD_PLAYER:-}" ]; then
            ARGS+=("--add-player=${INPUT_ADD_PLAYER}")
          fi
          if [ -n "${INPUT_REMOVE_PLAYER:-}" ]; then
            ARGS+=("--remove-player=${INPUT_REMOVE_PLAYER}")
          fi
          if [ "${INPUT_BACKFILL:-false}" = "true" ]; then
            ARGS+=("--arranged-scan-seconds=1320")
          fi
          if [ -n "${INPUT_DELETE_IDS:-}" ]; then
            ARGS+=("--delete-message-ids=${INPUT_DELETE_IDS}")
          fi

          python3 run_ranking.py "${ARGS[@]}"

      - name: Auditoria anti-vazamento e persistencia de estado
        if: steps.guard.outputs.should_run == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          SECRET_PATTERN='(((ptb|canary)\.)?discord(app)?\.com/api/(v[0-9]+/)?webhooks/[0-9]+|STEAM_(WEB_)?API_KEY=[A-Za-z0-9]{16,}|[?&]key=[A-Za-z0-9]{16,64}|gh[pos]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY)'

          # Bloqueia qualquer URL real de webhook ou token antes de commitar (incluindo SQLite)
          if grep -RInE "${SECRET_PATTERN}" \
            config.json *.py ranking_unificado_br.* jogadores_br_steam.* times_arranjados_2v2_br.* 2>/dev/null \
            || ([ -f ranking_cache.db ] && grep -aEq "${SECRET_PATTERN}" ranking_cache.db); then
            echo "::error::Bloqueio de seguranca: padrao de credencial detectado em arquivo rastreado!"
            exit 1
          fi

          for f in config.json ranking_cache.db ranking_unificado_br.json ranking_unificado_br.csv jogadores_br_steam.json jogadores_br_steam.csv times_arranjados_2v2_br.json times_arranjados_2v2_br.csv; do
            if [ -f "$f" ]; then
              git add -- "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao de estado neste ciclo."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(state): atualizar Ranking Unificado BR [skip ci]"
            PUSHED=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:${TARGET_BRANCH}"; then
                echo "Estado do Ranking salvo em ${TARGET_BRANCH}."
                PUSHED=1
                break
              fi
              git pull --rebase origin "${TARGET_BRANCH}" || true
              sleep 2
            done
            if [ "${PUSHED}" -ne 1 ]; then
              echo "::error::Falha ao enviar atualizacao de estado para ${TARGET_BRANCH} apos 3 tentativas."
              exit 1
            fi
          fi

      - name: Watchdog cruzado — recuperar Boletim Diario atrasado se pendente apos 06h BRT
        if: always() && !cancelled() && github.repository == 'nigosky/coh3-br-ranking' && github.ref == 'refs/heads/main'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DAILY_DUE="$(python3 schedule_guard.py --check daily --json | python3 -c 'import json,sys; print("true" if json.load(sys.stdin)["daily"]["due"] else "false")')"
          if [ "${DAILY_DUE}" != "true" ]; then
            echo "Boletim Diario em dia; nenhum disparo de recuperacao necessario."
            exit 0
          fi

          PENDING_DAILY="$(gh api 'repos/nigosky/coh3-br-ranking/actions/workflows/boletim_diario.yml/runs?per_page=10' \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting")] | length')"
          if [ "${PENDING_DAILY:-0}" -gt 0 ]; then
            echo "Ja existe ${PENDING_DAILY} execucao do Boletim Diario em fila/andamento; evitando duplicidade."
            exit 0
          fi

          echo "Watchdog detectou Boletim Diario pendente apos 06:00 BRT; disparando boletim_diario.yml via GITHUB_TOKEN..."
          gh workflow run boletim_diario.yml --repo nigosky/coh3-br-ranking --ref main

      - name: Resumo da Execucao
        if: always()
        env:
          SHOULD_RUN: ${{ steps.guard.outputs.should_run }}
          RANKING_SLOT: ${{ steps.guard.outputs.ranking_slot }}
        run: |
          UTC_NOW="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          BRT_NOW="$(TZ='America/Sao_Paulo' date '+%Y-%m-%d %H:%M:%S BRT')"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### 🏆 CoH3 Brasil — Ranking Unificado BR"
              echo "- **Horário (BRT):** ${BRT_NOW} (${UTC_NOW})"
              echo "- **Janela BRT:** \`${RANKING_SLOT:-N/D}\` • **Executado:** \`${SHOULD_RUN:-true}\`"
              echo "- **Agendamento:** 2x/dia (\`00:02\` + backup \`00:37 BRT\` e \`12:02\` + backup \`12:37 BRT\`) + watchdog cruzado"
              echo "- **Painéis:** \`Ranking Unificado BR (Skill Points: 1v1/2v2/3v3/4v4)\` + \`Times Arranjados 2v2 BR (COH3 Stats)\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
