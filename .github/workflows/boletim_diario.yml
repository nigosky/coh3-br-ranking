name: CoH3 Brasil — Boletim Diário dos Veteranos (08:03 BRT)

on:
  schedule:
    # Janelas fora do minuto :00 (evita fila/drop do cron do GitHub) + backups idempotentes:
    # Principal (08:03 BRT = 11:03 UTC), backup 1 (08:37 BRT = 11:37 UTC), backup 2 (10:17 BRT = 13:17 UTC)
    - cron: '3 11 * * *'
    - cron: '37 11 * * *'
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Data alvo YYYY-MM-DD em BRT (vazio = dia anterior)'
        required: false
        type: string
        default: ''
      force_post:
        description: 'Forçar reenvio mesmo se esta data já tiver sido publicada'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Simulação offline (gera JSON sem publicar no Discord)'
        required: false
        type: boolean
        default: false
      delete_message_ids:
        description: '🧹 IDs de mensagens antigas do Discord para apagar (separados por vírgula)'
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: coh3-br-ranking-state
  cancel-in-progress: false

jobs:
  daily-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout seguro na branch ativa (SHA imutavel)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Checagem idempotente de janela BRT (evita duplicacao em cron de backup)
        id: guard
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 schedule_guard.py --check both --github-output
          if [ "${EVENT_NAME}" = "schedule" ]; then
            DAILY_DUE="$(grep -E '^daily_due=' "${GITHUB_OUTPUT}" | tail -n1 | cut -d= -f2 || echo 'true')"
            if [ "${DAILY_DUE}" = "true" ]; then
              echo "should_run=true" >> "${GITHUB_OUTPUT}"
            else
              echo "should_run=false" >> "${GITHUB_OUTPUT}"
              echo "Boletim Diario de ontem ja publicado/verificado; encerrando cedo sem reprocessar."
            fi
          else
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Preparar renderizador grafico seguro (apt oficial assinado GPG, zero pip)
        if: steps.guard.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          APT_OPTS=(-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=25 -o Acquire::Retries=2)
          NEED_PKGS=()
          if ! python3 -c "from PIL import Image, ImageDraw, ImageFont" >/dev/null 2>&1; then
            NEED_PKGS+=("python3-pil")
          fi
          if [ ! -d "/usr/share/fonts/truetype/dejavu" ]; then
            NEED_PKGS+=("fonts-dejavu-core" "fonts-liberation")
          fi
          if [ ! -d "/usr/share/fonts/truetype/roboto" ]; then
            NEED_PKGS+=("fonts-roboto")
          fi
          NEED_CJK=0
          if [ -z "$(find /usr/share/fonts \( -iname '*NotoSansCJK*' -o -iname 'wqy-*.ttc' \) -print -quit 2>/dev/null)" ]; then
            NEED_CJK=1
          fi
          if [ "${#NEED_PKGS[@]}" -gt 0 ] || [ "${NEED_CJK}" -eq 1 ]; then
            sudo apt-get "${APT_OPTS[@]}" update -qq
          fi
          if [ "${#NEED_PKGS[@]}" -gt 0 ]; then
            sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends "${NEED_PKGS[@]}"
          fi
          if [ "${NEED_CJK}" -eq 1 ]; then
            timeout 90 sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends fonts-wqy-microhei \
              || echo "::warning::Fonte CJK opcional (fonts-wqy-microhei) indisponivel no mirror Ubuntu; seguindo com fallback DejaVu."
          fi

      - name: Executar suite de testes automatizados (gate pre-publicacao)
        if: steps.guard.outputs.should_run == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m py_compile *.py tests/*.py
          python3 -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Gerar e publicar Boletim Diario dos Veteranos e Jogo do Dia
        if: steps.guard.outputs.should_run == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          DISCORD_DAILY_RECAP_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_RECAP_WEBHOOK_URL }}
          DISCORD_RANKING_WEBHOOK_URL: ${{ secrets.DISCORD_RANKING_WEBHOOK_URL }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          INPUT_DATE: ${{ inputs.target_date }}
          INPUT_FORCE: ${{ inputs.force_post }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_DELETE_IDS: ${{ inputs.delete_message_ids }}
        run: |
          set -euo pipefail

          ARGS=()
          if [ -n "${DISCORD_DAILY_RECAP_WEBHOOK_URL:-}" ] || [ -n "${DISCORD_RANKING_WEBHOOK_URL:-}" ]; then
            ARGS+=(--verify-discord)
          else
            echo "::notice::Nenhum Webhook configurado — executando em modo de validacao offline."
          fi

          if [ -n "${INPUT_DATE:-}" ]; then
            ARGS+=("--date=${INPUT_DATE}")
          fi
          if [ "${INPUT_FORCE:-false}" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "${INPUT_DELETE_IDS:-}" ]; then
            ARGS+=("--delete-message-ids=${INPUT_DELETE_IDS}")
          fi

          python3 run_daily_recap.py "${ARGS[@]}"

      - name: Auditoria anti-vazamento e persistencia de estado
        if: steps.guard.outputs.should_run == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          SECRET_PATTERN='(((ptb|canary)\.)?discord(app)?\.com/api/(v[0-9]+/)?webhooks/[0-9]+|DISCORD_(RANKING_|DAILY_RECAP_|BATTLEGROUPS_)?WEBHOOK_URL=https://|STEAM_(WEB_)?API_KEY=[A-Za-z0-9]{16,}|[?&]key=[A-Za-z0-9]{16,64}|gh[pos]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY)'

          if grep -RInE "${SECRET_PATTERN}" \
            config.json *.py boletim_diario_br.json 2>/dev/null \
            || ([ -f ranking_cache.db ] && grep -aEq "${SECRET_PATTERN}" ranking_cache.db); then
            echo "::error::Bloqueio de seguranca: padrao de credencial detectado em arquivo rastreado!"
            exit 1
          fi

          for f in boletim_diario_br.json ranking_cache.db; do
            if [ -f "$f" ]; then
              git add -- "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao de estado neste ciclo."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(daily): atualizar Boletim Diário dos Veteranos [skip ci]"
            PUSHED=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:${TARGET_BRANCH}"; then
                echo "Estado do Boletim Diário salvo em ${TARGET_BRANCH}."
                PUSHED=1
                break
              fi
              git pull --rebase origin "${TARGET_BRANCH}" || true
              sleep 2
            done
            if [ "${PUSHED}" -ne 1 ]; then
              echo "::error::Falha ao enviar estado do Boletim Diário apos 3 tentativas."
              exit 1
            fi
          fi

      - name: Watchdog cruzado — recuperar Ranking Unificado atrasado se janela BRT pendente
        if: always() && !cancelled() && github.repository == 'nigosky/coh3-br-ranking' && github.ref == 'refs/heads/main' && inputs.dry_run != true
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RANKING_DUE="$(python3 schedule_guard.py --check ranking --json | python3 -c 'import json,sys; print("true" if json.load(sys.stdin)["ranking"]["due"] else "false")')"
          if [ "${RANKING_DUE}" != "true" ]; then
            echo "Ranking Unificado em dia nesta janela BRT; nenhum disparo de recuperacao necessario."
            exit 0
          fi

          PENDING_RANKING="$(gh api 'repos/nigosky/coh3-br-ranking/actions/workflows/ranking_unificado.yml/runs?per_page=10' \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting")] | length')"
          if [ "${PENDING_RANKING:-0}" -gt 0 ]; then
            echo "Ja existe ${PENDING_RANKING} execucao do Ranking em fila/andamento; evitando duplicidade."
            exit 0
          fi

          echo "Watchdog detectou janela BRT do Ranking pendente; disparando ranking_unificado.yml via GITHUB_TOKEN..."
          gh workflow run ranking_unificado.yml --repo nigosky/coh3-br-ranking --ref main -f force_update=true

      - name: Resumo da Execucao
        if: always()
        env:
          SHOULD_RUN: ${{ steps.guard.outputs.should_run }}
          DAILY_DATE: ${{ steps.guard.outputs.daily_target_date }}
        run: |
          UTC_NOW="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          BRT_NOW="$(TZ='America/Sao_Paulo' date '+%Y-%m-%d %H:%M:%S BRT')"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### 📰 CoH3 Brasil — Boletim Diário dos Veteranos"
              echo "- **Horário (BRT):** ${BRT_NOW} (${UTC_NOW})"
              echo "- **Data alvo BRT:** \`${DAILY_DATE:-N/D}\` • **Executado:** \`${SHOULD_RUN:-true}\`"
              echo "- **Agendamento:** Diário às \`08:03 BRT\` (backups \`08:37\` e \`10:17 BRT\`) + watchdog cruzado"
              echo "- **Conteúdo:** Resumo de jogos/vitórias/saldo ELO do dia anterior + Prêmios do Dia + Card \`Jogo do Dia\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
